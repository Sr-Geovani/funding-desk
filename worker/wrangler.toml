name = "funding-desk-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"] # SDK da Anthropic (Jarbas)

# Robô de mineração: um ciclo a cada 3 min (cabe no limite grátis de escritas do KV).
[triggers]
crons = ["* * * * *"] # ciclo completo nos minutos múltiplos de 3; nos outros, só o vigia de bloco do Sniper

# Armazena configuração, estado e log do robô. O id é preenchido pelo workflow de deploy.
[[kv_namespaces]]
binding = "FD_KV"
id = "__KV_ID__"

[vars]
# "test" usa api-test.nicehash.com; troque para "prod" só depois de validar em modo observar.
NH_ENV = "test"
# Origem do painel (GitHub Pages). Separe várias com vírgula.
ALLOWED_ORIGIN = "https://sr-geovani.github.io"
# Tetos que o servidor impõe a qualquer pedido (painel ou robô).
MAX_ORDER_BTC = "0.01"
MAX_LIMIT_PH = "100"
MAX_DAILY_USD = "1000"

# Segredos (NUNCA aqui). A instalação (scripts/deploy-backend.sh ou o workflow) cria:
#   PANEL_TOKEN   token do painel (mínimo 24 caracteres)
#   ENC_KEY       cifra as contas cadastradas pelo painel (nunca troque: as contas salvas ficariam ilegíveis)
# NiceHash e Telegram: cadastre no painel (Ajustes → Conectar contas). Ficam cifrados no KV e vencem
# estes segredos opcionais, se existirem: NH_API_KEY, NH_API_SECRET, NH_ORG_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# O ambiente da NiceHash (teste/produção) também é escolhido no painel; NH_ENV abaixo é só o padrão.

# Armazenamento principal (o KV gratuito só aceita 1.000 gravações por dia; o Durable Object SQLite aceita muito mais)
[[durable_objects.bindings]]
name = "FD_STORE"
class_name = "StoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDO"]
