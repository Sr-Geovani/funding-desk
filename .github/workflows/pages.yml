name: Testes e deploy (GitHub Pages)
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'   # foto do livro da NiceHash; o GitHub pode atrasar ou pular agendamentos (o backend dá tempo real)
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js tests/*.test.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site (só arquivos públicos do app)
        run: |
          mkdir _site
          cp -r index.html diagnostico.html core.js mining.js copilot.js radar.js app.js sw.js manifest.json icons _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fotos de mercado (livros NiceHash por algoritmo e WhatToMine)
        run: node scripts/snapshot-nicehash.js _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
