name: Deploy do backend (Cloudflare Worker)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'core.js', 'radar.js', 'copilot.js', 'scripts/deploy-backend.sh', '.github/workflows/worker.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: npm ci
      - name: Testes
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Conferir credenciais do Cloudflare
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Defina CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions. Deploy pulado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      # Mesmo script da instalação manual: conta, subdomínio, KV, deploy, ENC_KEY e PANEL_TOKEN (do segredo do GitHub).
      # Em Actions o log é público: o script não imprime token nem link.
      - name: Publicar backend
        id: deploy
        if: steps.creds.outputs.ok == '1'
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: bash scripts/deploy-backend.sh
      # Opcional: segredos NH_*/TELEGRAM_* do GitHub vão para o Worker. Recomendado: Ajustes → Conectar contas (cifrado no backend).
      - name: Segredos do Worker (opcionais)
        if: steps.deploy.outcome == 'success'
        env:
          ACCOUNT: ${{ steps.deploy.outputs.account }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NH_API_KEY: ${{ secrets.NH_API_KEY }}
          NH_API_SECRET: ${{ secrets.NH_API_SECRET }}
          NH_ORG_ID: ${{ secrets.NH_ORG_ID }}
        run: |
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); A="$ACCOUNT"
          echo "::add-mask::$T"
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID NH_API_KEY NH_API_SECRET NH_ORG_ID; do
            v="${!k}"
            [ -n "$v" ] || continue
            curl -sS -X PUT -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
              --data "$(jq -n --arg n "$k" --arg v "$v" '{name:$n,text:$v,type:"secret_text"}')" \
              "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/funding-desk-api/secrets" | jq -e '.success' >/dev/null && echo "segredo $k atualizado"
          done
      # Resumo da execução: endereço do backend, saúde e o que falta (aparece na página da execução).
      - name: Resumo
        if: always()
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.creds.outputs.ok }}" != "1" ]; then
            echo "### Backend não publicado" >> "$S"
            echo "Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Alternativa: scripts/deploy-backend.sh com um token do Cloudflare." >> "$S"
            exit 0
          fi
          URL="${{ steps.deploy.outputs.url }}"
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "### Backend não publicado" >> "$S"
            echo "A etapa **Publicar backend** falhou; o motivo está no log dela (mensagem do Cloudflare)." >> "$S"
            exit 0
          fi
          echo "### Backend publicado" >> "$S"
          echo "Endereço: **$URL**" >> "$S"
          echo "" >> "$S"; echo "Saúde: \`${{ steps.deploy.outputs.health }}\`" >> "$S"
          echo "" >> "$S"
          [ -n "$PANEL_TOKEN" ] && echo "- PANEL_TOKEN no GitHub: ok" >> "$S" || echo "- PANEL_TOKEN no GitHub: não (normal se a instalação foi pelo script)" >> "$S"
          echo "- NiceHash e Telegram: cadastre no painel, Ajustes → Conectar contas (ficam cifrados no backend)" >> "$S"
